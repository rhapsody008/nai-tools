apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  timeout: 20m # first install compiles the driver on the node; default 5m is too short
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
