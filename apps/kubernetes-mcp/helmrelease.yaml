apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp-server
spec:
  interval: 30m
  chart:
    spec:
      chart: kubernetes-mcp-server
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: kubernetes-mcp-server
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
