apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "v1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn/
      guaranteedEngineManagerCPU: 12
      guaranteedReplicaManagerCPU: 12
      taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"
      # Pin instance-manager, share-manager, engine-image, backing-image-manager and CSI
      # components to the GPU node. Only applied while no Longhorn volumes are attached.
      systemManagedComponentsNodeSelector: "node.cluster.x-k8s.io/longhorn-system-managed:true"
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 3
      reclaimPolicy: Retain
    csi:
      attacherReplicaCount: 3
      provisionerReplicaCount: 3
      resizerReplicaCount: 3
      snapshotterReplicaCount: 3
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
