tunnel: zy-metal-tunnel
credentials-file: /etc/cloudflared/creds/credentials.json

ingress:
  - hostname: jaeger.yolocal.cloud
    service: http://jaeger-jaeger-operator-jaeger-query.istio-system.svc.cluster.local:16686
  - hostname: openwebui.yolocal.cloud
    service: http://openwebui-svc.openwebui.svc.cluster.local:8080
  - hostname: zy-gpu-k8s-mcp.yolocal.cloud
    service: http://kubernetes-mcp-server.kubernetes-mcp-server.svc.cluster.local:8080
  - hostname: longhorn.yolocal.cloud
    service: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
  - hostname: nai.yolocal.cloud
    service: https://172.16.0.87
    originRequest:
      noTLSVerify: true
      originServerName: https://nai.yolocal.cloud
  - hostname: wskn-ds.yolocal.cloud
    service: http://172.16.0.248:8080    
  - service: http_status:404
