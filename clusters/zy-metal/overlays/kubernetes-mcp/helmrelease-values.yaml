apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp-server
spec:
  values:
    # cluster-admin, bound deliberately for a test env — this server is reachable
    # publicly through the cloudflared tunnel, so the Access policy on
    # zy-gpu-k8s-mcp.yolocal.cloud is now the only thing standing between the internet and
    # full cluster control. Revisit if this namespace ever stops being disposable.
    rbac:
      create: true
      extraClusterRoleBindings:
        - name: kubernetes-mcp-server-admin
          roleRef:
            name: cluster-admin
            external: true
    ingress:
      enabled: false # routing handled by cloudflared config.yaml, not a k8s Ingress
