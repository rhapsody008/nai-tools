apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx-gpu
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  nodeSelector: "gpu-node" # File storage pinned to GPU server; node/disk tag gpu-node comes from the node annotations set before install (see README.md)
  fsType: "ext4"