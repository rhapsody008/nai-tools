apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn/
      # Disks come only from the node annotation node.longhorn.io/default-disks-config on
      # nodes labelled node.longhorn.io/create-default-disk=config (see README.md here).
      # Unlabelled nodes get no Longhorn disk.
      createDefaultDiskLabeledNodes: true
      taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"
      # Pin instance-manager, share-manager, engine-image, backing-image-manager and CSI
      # components to the GPU node. Only applied while no Longhorn volumes are attached.
      systemManagedComponentsNodeSelector: "node.cluster.x-k8s.io/longhorn-system-managed:true"
    # Replica counts are 1: the GPU node is the only Longhorn storage node, and the CSI
    # components are pinned to it by systemManagedComponentsNodeSelector.
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
      reclaimPolicy: Retain
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
